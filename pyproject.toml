[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apiwarden"
# Read from src/apiwarden/__init__.py — one place to bump. Two copies drift,
# and a drifted version only surfaces as a 400 from PyPI at the upload step.
dynamic = ["version"]
description = "Watches your OpenAPI specs and serves them live, for humans and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mohamadali Firoozi", email = "t7spotter@gmail.com"}]
keywords = ["openapi", "documentation", "django", "mcp", "swagger", "live-reload"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Django>=4.2"]
browser = ["playwright>=1.40"]

[project.scripts]
apiwarden = "apiwarden.cli:main"

[project.urls]
Homepage = "https://github.com/t7spotter/apiwarden"

[tool.hatch.version]
path = "src/apiwarden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/apiwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
