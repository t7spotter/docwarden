[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docwarden"
version = "0.1.0"
description = "Watches your OpenAPI specs and serves them live, for humans and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohamadali Firoozi", email = "firooziparse@gmail.com"}]
keywords = ["openapi", "documentation", "django", "mcp", "swagger", "live-reload"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Django>=4.2"]
browser = ["playwright>=1.40"]

[project.scripts]
docwarden = "docwarden.cli:main"

[project.urls]
Homepage = "https://github.com/firooziparse/docwarden"

[tool.hatch.build.targets.wheel]
packages = ["src/docwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
