[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apidocs-live"
version = "0.1.0"
description = "Serve a directory of OpenAPI specs as a live docs portal for humans and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Backend Team", email = "firooziparse@gmail.com"}]
keywords = ["openapi", "documentation", "django", "mcp", "swagger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Django>=4.2"]
browser = ["playwright>=1.40"]

[project.scripts]
apidocs = "apidocs_live.cli:main"

[project.urls]
Homepage = "https://github.com/firooziparse/apidocs-live"

[tool.hatch.build.targets.wheel]
packages = ["src/apidocs_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
