name: Release

# Push a tag matching v* (e.g. v0.1.0) to build and publish to PyPI.
# Uses PyPI's trusted publishing (OIDC) — no API token stored anywhere. The
# permission to publish is granted by PyPI to *this exact workflow*, not to a
# secret that could leak.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine

      # Fail here rather than 15 seconds into the upload. A tag that does not
      # match the package version builds the *previous* version's filenames,
      # and PyPI refuses those permanently — filenames are never reusable, even
      # after a delete. Catching it before the build keeps the version free.
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oP '__version__ = "\K[^"]+' src/apiwarden/__init__.py)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match __version__ $version — bump src/apiwarden/__init__.py, or re-tag as v$version"
            exit 1
          fi
          echo "releasing $version"

      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing; nothing else needs this
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
